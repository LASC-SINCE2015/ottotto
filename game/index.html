<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaf4" />
    <meta name="description" content="四角いもちもちの生き物を積み上げる、ブラウザで遊べるバランスゲーム。" />
    <title>おっとっとタワー</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main id="stage">
      <canvas id="game" aria-label="ゲーム画面"></canvas>

      <!-- 遊んでいるあいだの表示 -->
      <header id="hud" class="hidden">
        <div class="hud-left">
          <div class="hud-score"><span id="hud-score">0</span><small>てん</small></div>
          <div class="hud-height">たかさ <span id="hud-height">0.0</span>cm</div>
        </div>
        <div class="hud-right">
          <div id="hud-lives" class="lives" aria-label="のこり"></div>
          <button id="btn-sound" class="icon-btn" type="button" aria-label="音のオン・オフ">♪</button>
        </div>
      </header>

      <!-- タイトル -->
      <section id="title" class="overlay">
        <div class="card">
          <p class="subtitle">もちもち四角バランス</p>
          <h1>おっとっと<br />タワー</h1>
          <canvas id="title-chara" width="200" height="200" aria-hidden="true"></canvas>
          <button id="btn-start" class="btn primary" type="button">あそぶ</button>
          <ul class="howto">
            <li>タップ（クリック）した場所に落とす</li>
            <li>指でなぞって位置を決めて、はなすと落ちる</li>
            <li><b>3匹</b>落としたらおしまい</li>
            <li>まっすぐ重ねると<b>ピタッと賞</b>、ぎりぎりで耐えると<b>ギリギリ賞</b></li>
          </ul>
          <p class="best">ベスト <span id="title-best">0</span> てん</p>
          <p class="version">v<span id="version"></span></p>
        </div>
      </section>

      <!-- ゲームオーバー -->
      <section id="over" class="overlay hidden">
        <div class="card">
          <h2>おっとっと…</h2>
          <p class="result-score"><span id="over-score">0</span><small>てん</small></p>
          <p class="result-sub">たかさ <span id="over-height">0</span>cm ・ <span id="over-count">0</span>匹</p>
          <p id="over-new" class="new hidden">ベスト更新！</p>
          <p class="best">ベスト <span id="over-best">0</span> てん</p>
          <button id="btn-retry" class="btn primary" type="button">もういちど</button>
          <button id="btn-share" class="btn" type="button">結果をシェア</button>
          <button id="btn-title" class="btn ghost" type="button">タイトルへ</button>
        </div>
      </section>

      <div id="toast" class="toast hidden"></div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/chara.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
